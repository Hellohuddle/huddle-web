# Configuracion del CMS. GENERADA por huddle_4_cms.py desde contenido.json.
# Si se anade un campo al JSON, hay que regenerar este archivo: el CMS borra al
# guardar cualquier campo que no tenga declarado.

backend:
  name: github
  repo: Hellohuddle/huddle-web
  branch: main
  base_url: https://api.netlify.com   # proveedor OAuth de Netlify
  commit_messages:
    update: "contenido: {{collection}} actualizado desde el CMS"

publish_mode: simple
site_url: https://hellohuddleplace.com
display_url: https://hellohuddleplace.com
media_folder: img
public_folder: /img

collections:
  - name: sitio
    label: "Huddle"
    files:
      - name: contenido
        label: "Page content"
        file: contenido.json
        format: json
        description: "Change the wording and the figures. Press Publish and the site updates in about two minutes."
        fields:
          - name: hero
            label: "Hero (top of the page)"
            widget: object
            collapsed: true
            fields:
              - name: etiqueta
                label: "Label"
                widget: string
                required: true
              - name: titulo
                label: "Headline"
                widget: string
                hint: "Use <br> to break the line and <em>…</em> for the words in orange."
                required: true
              - name: sub
                label: "Subtitle"
                widget: text
                required: true
          - name: heroDatos
            label: "Hero figures"
            widget: list
            collapsed: true
            summary: "{{fields.etiqueta}}"
            fields:
              - name: etiqueta
                label: "Label"
                widget: string
                required: true
              - name: valor
